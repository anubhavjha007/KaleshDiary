<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalesh Diary of Divvii</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-bg: #ffe1ec;
    --pink-card: #fff5f8;
    --pink-deep: #ff9fc0;
    --pink-line: #ffc2d8;
    --yellow: #ffd23f;
    --yellow-deep: #f5a623;
    --text-soft: #a3536b;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 20% 10%, #fff0f5 0%, var(--pink-bg) 55%, #ffcfe0 100%);
    font-family:'Poppins', sans-serif;
    display:flex;
    justify-content:center;
    padding:40px 16px 80px;
  }

  .book{
    width:100%;
    max-width:520px;
    background:
      repeating-linear-gradient(
        var(--pink-card) 0px, var(--pink-card) 31px,
        var(--pink-line) 32px
      );
    background-color: var(--pink-card);
    border-radius:28px;
    outline: 3px dashed var(--pink-deep);
    outline-offset: -12px;
    box-shadow: 0 20px 45px rgba(255,140,180,0.35), inset 0 0 0 2px #fff;
    padding:32px 28px 36px;
    position:relative;
    overflow:hidden;
  }

  /* red-ish margin line like a real notebook page */
  .book::before{
    content:'';
    position:absolute;
    left:58px;
    top:0;
    bottom:0;
    width:2px;
    background: repeating-linear-gradient(
      to bottom, #ffb3c6 0 6px, transparent 6px 12px
    );
    opacity:.7;
  }

  /* little doodle in the corner for extra cute */
  .book::after{
    content:'✨';
    position:absolute;
    top:14px;
    right:20px;
    font-size:20px;
  }

  /* washi tape strip holding the diary "shut" */
  .tape{
    position:absolute;
    top:-10px;
    left:50%;
    transform: translateX(-50%) rotate(-3deg);
    width:120px;
    height:28px;
    background: repeating-linear-gradient(45deg, #ffd23f, #ffd23f 6px, #ffe27a 6px, #ffe27a 12px);
    opacity:.85;
    border:1px dashed rgba(255,255,255,0.6);
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
  }

  /* spiral binding on the left */
  .spiral{
    position:absolute;
    left:14px;
    top:0;
    bottom:0;
    width:26px;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    align-items:center;
  }
  .spiral span{
    width:20px;
    height:20px;
    border-radius:50%;
    background: linear-gradient(145deg,#fff,#ffd4e4);
    box-shadow: inset 0 2px 3px rgba(255,150,180,0.6), 0 1px 2px rgba(0,0,0,0.08);
    border:2px dashed var(--pink-deep);
  }

  .content{ margin-left:34px; position:relative; z-index:1; }

  h1{
    font-family:'Great Vibes', cursive;
    font-size:44px;
    color:var(--pink-deep);
    text-align:center;
    margin:0 0 2px;
    text-shadow: 1px 1px 0 #fff;
  }
  .subtitle{
    text-align:center;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-soft);
    margin-bottom:22px;
  }

  .add-row{
    display:flex;
    gap:8px;
    margin-bottom:22px;
  }
  #entryInput{
    flex:1;
    padding:12px 14px;
    border-radius:16px;
    border:2.5px dashed var(--pink-deep);
    background:#fffafc;
    font-family:'Poppins',sans-serif;
    font-size:14px;
    color:var(--yellow-deep);
    outline:none;
  }
  #entryInput::placeholder{ color: #ffbfd6; }
  #entryInput:focus{ border-style:solid; box-shadow:0 0 0 3px #ffd6e5; }

  #addBtn{
    border:2px solid #d98a12;
    border-radius:16px;
    padding:0 20px;
    background: linear-gradient(145deg, var(--yellow), var(--yellow-deep));
    color:#fff;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    box-shadow: 0 6px 0 #d98a12, 0 8px 14px rgba(245,166,35,0.35);
    transition: transform .08s ease;
  }
  #addBtn:active{ transform: translateY(4px); box-shadow: 0 2px 0 #d98a12; }

  #diaryList{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .entry{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border-radius:16px;
    padding:10px 12px;
    box-shadow: 0 3px 8px rgba(255,150,180,0.25);
    border:2px dashed var(--pink-line);
    border-left:4px solid var(--pink-deep);
    animation: pop .25s ease;
  }
  @keyframes pop{
    from{ transform:scale(.9); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }

  .entry-text{
    flex:1;
    color: var(--yellow-deep);
    font-weight:500;
    font-size:14.5px;
    word-break:break-word;
  }
  .entry.done .entry-text{
    text-decoration: line-through wavy var(--pink-deep);
    color:#e0b2c2;
    opacity:.75;
  }

  .icon-btn{
    border:none;
    cursor:pointer;
    width:30px;
    height:30px;
    border-radius:50%;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition: transform .1s ease;
  }
  .icon-btn:active{ transform: scale(.85); }

  .tick-btn{
    background: linear-gradient(145deg,#c8f7d4,#8fe6a8);
    color:#2f8f4e;
    border:2px solid #4fae6d !important;
  }
  .cross-btn{
    background: linear-gradient(145deg,#ffd0d8,#ff9aab);
    color:#a12a3a;
    border:2px solid #d9556b !important;
  }

  .empty-msg{
    text-align:center;
    color:#e0a6bd;
    font-size:13px;
    padding:14px 0;
    font-style:italic;
  }

  /* ===== Responsive ===== */
  @media (max-width: 600px){
    body{ padding:24px 10px 60px; }
    .book{ padding:28px 18px 28px; border-radius:22px; }
    h1{ font-size:36px; }
    .subtitle{ font-size:11px; letter-spacing:1.5px; }
    .book::before{ left:46px; }
    .content{ margin-left:26px; }
    .spiral{ width:20px; left:8px; }
    .spiral span{ width:16px; height:16px; }
  }

  @media (max-width: 420px){
    body{ padding:18px 6px 50px; }
    .book{ padding:24px 14px 24px; border-radius:18px; }
    h1{ font-size:30px; }
    .subtitle{ font-size:10px; margin-bottom:16px; }
    .tape{ width:90px; height:22px; top:-8px; }
    .add-row{ flex-direction:column; gap:10px; margin-bottom:18px; }
    #addBtn{ padding:10px 0; box-shadow: 0 4px 0 #d98a12, 0 6px 10px rgba(245,166,35,0.35); }
    .book::before{ left:38px; }
    .content{ margin-left:20px; }
    .spiral{ width:16px; left:6px; }
    .spiral span{ width:13px; height:13px; }
    .entry{ padding:9px 10px; gap:8px; }
    .entry-text{ font-size:13.5px; }
    .icon-btn{ width:26px; height:26px; font-size:12px; }
    .book::after{ font-size:16px; top:10px; right:14px; }
  }

  @media (max-width: 340px){
    h1{ font-size:26px; }
    .spiral{ display:none; }
    .book::before{ left:16px; opacity:.4; }
    .content{ margin-left:8px; }
  }
</style>
</head>
<body>

<div class="book">
  <div class="tape"></div>
  <div class="spiral">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="content">
    <h1>Kalesh Diary of Divvii</h1>
    <div class="subtitle">every little fight, kept with love</div>

    <div class="add-row">
      <input type="text" id="entryInput" placeholder="Karlo Kalesh ab ...">
      <button id="addBtn">Add Kalesh</button>
    </div>

    <ul id="diaryList"></ul>
  </div>
</div>

<script>
  const STORAGE_KEY = 'kaleshDiary';
  const input = document.getElementById('entryInput');
  const addBtn = document.getElementById('addBtn');
  const list = document.getElementById('diaryList');

  function getEntries(){
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }

  function saveEntries(entries){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function render(){
    const entries = getEntries();
    list.innerHTML = '';

    if(entries.length === 0){
      const msg = document.createElement('div');
      msg.className = 'empty-msg';
      msg.textContent = 'NO KALESHH?? AH bachgye!';
      list.appendChild(msg);
      return;
    }

    entries.forEach((entry) => {
      const li = document.createElement('li');
      li.className = 'entry' + (entry.isComplete ? ' done' : '');
      li.dataset.id = entry.id;

      li.innerHTML = `
        <button class="icon-btn tick-btn" title="mark resolved">✓</button>
        <span class="entry-text">${escapeHtml(entry.text)}</span>
        <button class="icon-btn cross-btn" title="remove">✕</button>
      `;

      li.querySelector('.tick-btn').addEventListener('click', () => toggleComplete(entry.id));
      li.querySelector('.cross-btn').addEventListener('click', () => removeEntry(entry.id));

      list.appendChild(li);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function addEntry(){
    const text = input.value.trim();
    if(!text) return;

    const entries = getEntries();
    const newEntry = {
      id: Date.now().toString(),
      text: text,
      isComplete: false
    };

    entries.push(newEntry);
    saveEntries(entries);
    input.value = '';
    render();
  }

  function toggleComplete(id){
    const entries = getEntries();
    const updated = entries.map(e => e.id === id ? { ...e, isComplete: !e.isComplete } : e);
    saveEntries(updated);
    render();
  }

  function removeEntry(id){
    const entries = getEntries();
    const updated = entries.filter(e => e.id !== id);
    saveEntries(updated);
    render();
  }

  addBtn.addEventListener('click', addEntry);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addEntry();
  });

  render();
</script>

</body>
</html>
